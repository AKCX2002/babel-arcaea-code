name: Release & Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-and-release:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Auto-bump
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CUR=$(grep -oP "Version:\s*\K[0-9.]+" babel-arcaea-code.php | head -1)
          IFS=. read -r MAJ MIN PAT <<< "$CUR"
          NEW="$MAJ.$MIN.$((PAT+1))"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"
          sed -i "s/^ \* Version: $CUR/ * Version: $NEW/" babel-arcaea-code.php
          sed -i "s/^define('BAC_VERSION', '$CUR');/define('BAC_VERSION', '$NEW');/" babel-arcaea-code.php
          git add babel-arcaea-code.php
          git commit -m "chore: bump $CUR → $NEW [skip ci]"
          git push

      - name: Build zip
        id: build
        run: |
          VER="${{ steps.bump.outputs.new_version }}"
          ZIPNAME="babel-arcaea-code-$VER.zip"
          mkdir -p /tmp/plugin
          cp -r babel-arcaea-code.php assets lib /tmp/plugin/
          cd /tmp && mv plugin "babel-arcaea-code"
          zip -r "$ZIPNAME" "babel-arcaea-code/" -x "*.git*" "*.DS_Store"
          echo "zipname=$ZIPNAME" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.new_version }}
          ZIPNAME: ${{ steps.build.outputs.zipname }}
        run: |
          gh release create "v$VERSION" --title "v$VERSION" \
            --notes "See [CHANGELOG](https://github.com/${{ github.repository }}/commits/v$VERSION)" "/tmp/$ZIPNAME"

  # ── Daily sync ALL JS deps ──
  sync-deps:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 1. Mermaid ──
      - name: Check Mermaid
        id: mermaid
        run: |
          CUR=$(grep -oP "mermaid_version.*?'\K[0-9.]+" babel-arcaea-code.php)
          LAT=$(curl -sL "https://api.github.com/repos/mermaid-js/mermaid/releases/latest" | grep '"tag_name"' | head -1 | grep -oP '[0-9.]+')
          echo "current=$CUR" >> "$GITHUB_OUTPUT"; echo "latest=$LAT" >> "$GITHUB_OUTPUT"
          [ "$CUR" = "$LAT" ] && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Download Mermaid
        if: steps.mermaid.outputs.changed == 'true'
        run: |
          bash download-mermaid.sh "${{ steps.mermaid.outputs.latest }}"
          sed -i "s/mermaid_version.*'[0-9.]\+'/mermaid_version' => '${{ steps.mermaid.outputs.latest }}'/" babel-arcaea-code.php

      # ── 2. Prism.js ──
      - name: Check Prism
        id: prism
        run: |
          CUR=$(grep -oP "prism_version.*?'\K[0-9.]+" babel-arcaea-code.php)
          LAT=$(curl -sL "https://registry.npmjs.org/prismjs/latest" | grep -oP '"version":"\K[0-9.]+')
          echo "current=$CUR" >> "$GITHUB_OUTPUT"; echo "latest=$LAT" >> "$GITHUB_OUTPUT"
          [ "$CUR" = "$LAT" ] && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Download Prism
        if: steps.prism.outputs.changed == 'true'
        run: |
          LAT="${{ steps.prism.outputs.latest }}"; B="https://cdn.jsdelivr.net/npm/prismjs@${LAT}"
          for f in prism.min.js prism.css prism-toolbar.min.js prism-toolbar.min.css prism-copy-to-clipboard.min.js prism-line-numbers.min.js prism-line-numbers.min.css prism-autoloader.min.js; do
            curl -sL "$B/$(echo $f | sed 's/prism/prism/' | sed 's/-copy-to-clipboard/-copy/')" -o "assets/prism/$(echo $f | sed 's/^prism-//' | sed 's/^prism/prism/' | sed 's/^prism/prism/')" 2>/dev/null || :
          done
          curl -sL "$B/plugins/show-language/prism-show-language.min.js" -o assets/prism/prism-show-language.js
          curl -sL "$B/plugins/line-highlight/prism-line-highlight.min.js" -o assets/prism/prism-line-highlight.js
          curl -sL "$B/plugins/line-highlight/prism-line-highlight.min.css" -o assets/prism/prism-line-highlight.css
          curl -sL "$B/plugins/match-braces/prism-match-braces.min.js" -o assets/prism/prism-match-braces.js
          curl -sL "$B/plugins/normalize-whitespace/prism-normalize-whitespace.min.js" -o assets/prism/prism-normalize-whitespace.js
          curl -sL "$B/plugins/command-line/prism-command-line.min.js" -o assets/prism/prism-command-line.js
          curl -sL "$B/plugins/treeview/prism-treeview.min.js" -o assets/prism/prism-treeview.js
          curl -sL "$B/plugins/previewers/prism-previewers.min.js" -o assets/prism/prism-previewers.js
          curl -sL "$B/plugins/previewers/prism-previewers.min.css" -o assets/prism/prism-previewers.css
          for lang in c cpp bash python json yaml cmake makefile dart javascript typescript rust go php markdown css diff ini toml xml; do
            curl -sL "$B/components/prism-${lang}.min.js" -o "assets/prism/components/prism-${lang}.js"
          done
          curl -sL "https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" -o assets/js/medium-zoom.min.js
          sed -i "s/prism_version.*'[0-9.]\+'/prism_version' => '$LAT'/" babel-arcaea-code.php

      # ── 3. MathJax ──
      - name: Check MathJax
        id: mathjax
        run: |
          CUR=$(grep -oP "mathjax_version.*?'\K[0-9.]+" babel-arcaea-code.php)
          LAT=$(curl -sL "https://registry.npmjs.org/mathjax/latest" | grep -oP '"version":"\K[0-9.]+')
          echo "current=$CUR" >> "$GITHUB_OUTPUT"; echo "latest=$LAT" >> "$GITHUB_OUTPUT"
          [ "$CUR" = "$LAT" ] && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Download MathJax
        if: steps.mathjax.outputs.changed == 'true'
        run: |
          LAT="${{ steps.mathjax.outputs.latest }}"
          curl -sL "https://cdn.jsdelivr.net/npm/mathjax@${LAT}/es5/tex-chtml.js" -o assets/mathjax/es5/tex-chtml.js
          echo "MathJax $LAT: $(du -sh assets/mathjax/es5/tex-chtml.js)"
          sed -i "s/mathjax_version.*'[0-9.]\+'/mathjax_version' => '$LAT'/" babel-arcaea-code.php

      # ── PR if any dep changed ──
      - name: Create PR
        if: steps.mermaid.outputs.changed == 'true' || steps.prism.outputs.changed == 'true' || steps.mathjax.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: "chore: update deps [skip ci]"
          title: "chore: update deps${{ steps.mermaid.outputs.changed == 'true' && format(' Mermaid {0}', steps.mermaid.outputs.latest) || '' }}${{ steps.prism.outputs.changed == 'true' && format(' Prism {0}', steps.prism.outputs.latest) || '' }}${{ steps.mathjax.outputs.changed == 'true' && format(' MathJax {0}', steps.mathjax.outputs.latest) || '' }}"
          body: |
            Automated daily dependency update.

            | Dep | Current | Latest |
            |---|---|---:|
            | Mermaid | `${{ steps.mermaid.outputs.current }}` | `${{ steps.mermaid.outputs.latest }}` |
            | Prism.js | `${{ steps.prism.outputs.current }}` | `${{ steps.prism.outputs.latest }}` |
            | MathJax | `${{ steps.mathjax.outputs.current }}` | `${{ steps.mathjax.outputs.latest }}` |
          branch: chore/deps-bump
          base: main
          labels: automated, dependencies
