name: Release & Sync
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.gitignore']
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: babel-arcaea-code-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh supported dependency assets
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            python3 scripts/refresh-dependencies.py
          else
            python3 scripts/refresh-dependencies.py --latest
          fi
      - name: Validate release inputs
        run: |
          set -euo pipefail
          find includes -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l babel-arcaea-code.php
          php scripts/content-regression.php
          node --check assets/js/content-loader.js
          node --check assets/prism/prism-init.js
          node --check assets/js/image-zoom-init.js
          node scripts/validate-mermaid.mjs
          bash scripts/frontend-smoke.sh
          npm ci --ignore-scripts
          printf '# Test\n' | node bin/markmap-render.js > /tmp/bac-markmap.svg
          grep -q '<svg' /tmp/bac-markmap.svg
      - name: Detect source or asset changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = push ] || [ -n "$(git status --porcelain)" ]; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare and validate package
        id: package
        if: steps.changes.outputs.release == 'true'
        run: |
          set -euo pipefail
          VERSION=$(python3 scripts/bump-release.py)
          ZIPPATH=$(bash scripts/build-release.sh "$VERSION")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=$ZIPPATH" >> "$GITHUB_OUTPUT"
      - name: Commit validated release
        id: commit
        if: steps.changes.outputs.release == 'true'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add babel-arcaea-code.php package.json package-lock.json update-info.json includes assets
          git commit -m "chore: release $VERSION [skip ci]"
          # Reject concurrent source changes instead of rebasing validated assets.
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish validated commit
        if: steps.changes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          ZIPPATH: ${{ steps.package.outputs.path }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: gh release create "v$VERSION" --target "$RELEASE_SHA" --title "v$VERSION" --generate-notes "$ZIPPATH"
