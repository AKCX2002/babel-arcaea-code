name: Release & Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (patch/minor/major)'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Job 1: Auto-bump + release (unchanged) ──
  bump-and-release:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Auto-bump patch version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CUR=$(grep -oP "Version:\s*\K[0-9.]+" babel-arcaea-code.php | head -1)
          MAJOR=$(echo "$CUR" | cut -d. -f1)
          MINOR=$(echo "$CUR" | cut -d. -f2)
          PATCH=$(echo "$CUR" | cut -d. -f3)
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"
          sed -i "s/^ \* Version: $CUR/ * Version: $NEW/" babel-arcaea-code.php
          sed -i "s/^define('BAC_VERSION', '$CUR');/define('BAC_VERSION', '$NEW');/" babel-arcaea-code.php
          git add babel-arcaea-code.php
          git commit -m "chore: bump $CUR → $NEW [skip ci]"
          git push

      - name: Build plugin zip
        id: build
        run: |
          VER="${{ steps.bump.outputs.new_version }}"
          ZIPNAME="babel-arcaea-code-$VER.zip"
          mkdir -p /tmp/plugin
          cp -r babel-arcaea-code.php assets lib /tmp/plugin/
          cd /tmp && mv plugin "babel-arcaea-code"
          zip -r "$ZIPNAME" "babel-arcaea-code/" -x "*.git*" "*.DS_Store"
          ls -lh "$ZIPNAME"
          echo "zipname=$ZIPNAME" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.new_version }}
          ZIPNAME: ${{ steps.build.outputs.zipname }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes "See [CHANGELOG](https://github.com/${{ github.repository }}/commits/v$VERSION)" \
            "/tmp/$ZIPNAME"

  # ── Job 2: Daily sync Prism.js + Mermaid.js ──
  sync-deps:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Mermaid ──
      - name: Check Mermaid
        id: mermaid
        run: |
          CUR=$(grep -oP "mermaid_version.*?'\K[0-9.]+" babel-arcaea-code.php | head -1)
          LAT=$(curl -sL "https://api.github.com/repos/mermaid-js/mermaid/releases/latest" | grep '"tag_name"' | head -1 | grep -oP '[0-9.]+')
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "latest=$LAT" >> "$GITHUB_OUTPUT"
          if [ "$CUR" = "$LAT" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          echo "Mermaid: $CUR → $LAT"

      - name: Download new Mermaid
        if: steps.mermaid.outputs.changed == 'true'
        run: |
          LAT="${{ steps.mermaid.outputs.latest }}"
          BASE="https://cdn.jsdelivr.net/npm/mermaid@${LAT}/dist"
          # Main ESM module
          curl -sL "$BASE/mermaid.esm.min.mjs" -o assets/mermaid/mermaid.esm.min.mjs
          # Chunk files (required by ESM dynamic import)
          mkdir -p assets/mermaid/chunks/mermaid.esm.min
          # Fetch chunk list from API
          CHUNKS=$(curl -sL "https://data.jsdelivr.com/v1/packages/npm/mermaid@${LAT}" | \
            grep -oP 'dist/chunks/mermaid\.esm\.min/\K[^"]+\.mjs' | sort -u)
          for chunk in $CHUNKS; do
            curl -sL "$BASE/chunks/mermaid.esm.min/$chunk" -o "assets/mermaid/chunks/mermaid.esm.min/$chunk"
          done
          echo "Mermaid $LAT: downloaded $(echo "$CHUNKS" | wc -l) chunks"
          sed -i "s/mermaid_version.*'[0-9.]\+'/mermaid_version' => '$LAT'/" babel-arcaea-code.php

      # ── Prism.js ──
      - name: Check Prism.js
        id: prism
        run: |
          CUR=$(grep -oP "prism_version.*?'\K[0-9.]+" babel-arcaea-code.php | head -1)
          LAT=$(curl -sL "https://registry.npmjs.org/prismjs/latest" | grep -oP '"version":"\K[0-9.]+')
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "latest=$LAT" >> "$GITHUB_OUTPUT"
          if [ "$CUR" = "$LAT" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          echo "Prism.js: $CUR → $LAT"

      - name: Download new Prism
        if: steps.prism.outputs.changed == 'true'
        run: |
          LAT="${{ steps.prism.outputs.latest }}"
          BASE="https://cdn.jsdelivr.net/npm/prismjs@${LAT}"
          curl -sL "$BASE/prism.min.js" -o assets/prism/prism.js
          curl -sL "$BASE/themes/prism-okaidia.min.css" -o assets/prism/prism.css
          curl -sL "$BASE/plugins/toolbar/prism-toolbar.min.js" -o assets/prism/prism-toolbar.js
          curl -sL "$BASE/plugins/toolbar/prism-toolbar.min.css" -o assets/prism/prism-toolbar.css
          curl -sL "$BASE/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js" -o assets/prism/prism-copy.js
          curl -sL "$BASE/plugins/line-numbers/prism-line-numbers.min.js" -o assets/prism/prism-line-numbers.js
          curl -sL "$BASE/plugins/line-numbers/prism-line-numbers.min.css" -o assets/prism/prism-line-numbers.css
          curl -sL "$BASE/plugins/autoloader/prism-autoloader.min.js" -o assets/prism/prism-autoloader.js
          for lang in c cpp bash python json yaml cmake makefile dart javascript typescript rust go php markdown css diff ini toml xml; do
            curl -sL "$BASE/components/prism-${lang}.min.js" -o "assets/prism/components/prism-${lang}.js"
          done
          # Medium-zoom
          curl -sL "https://cdn.jsdelivr.net/npm/medium-zoom@latest/dist/medium-zoom.min.js" -o assets/js/medium-zoom.min.js
          sed -i "s/prism_version.*'[0-9.]\+'/prism_version' => '$LAT'/" babel-arcaea-code.php
          echo "Prism.js $LAT downloaded"

      # ── Any dep changed → PR ──
      - name: Create PR
        if: steps.mermaid.outputs.changed == 'true' || steps.prism.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: "chore: update deps [skip ci]"
          title: |
            chore: update deps${{ steps.mermaid.outputs.changed == 'true' && format(' | Mermaid {0}', steps.mermaid.outputs.latest) || '' }}${{ steps.prism.outputs.changed == 'true' && format(' | Prism.js {0}', steps.prism.outputs.latest) || '' }}
          body: |
            Automated daily dependency check.

            | Dep | Current | Latest |
            |---|---|---:|
            | **Mermaid** | `${{ steps.mermaid.outputs.current }}` | `${{ steps.mermaid.outputs.latest }}` |
            | **Prism.js** | `${{ steps.prism.outputs.current }}` | `${{ steps.prism.outputs.latest }}` |

            **Action required**: Review before merging.
          branch: chore/deps-bump
          base: main
          labels: automated, dependencies
