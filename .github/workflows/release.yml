name: Release & Sync

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: babel-arcaea-code-release
  cancel-in-progress: false

jobs:
  bump-and-release:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Refresh Mermaid assets
        run: bash download-mermaid.sh $(grep -oP "'mermaid_version'\s*=>\s*'\K[0-9.]+" includes/class-bac-options.php)

      - name: Refresh Prism assets
        run: bash download-prism.sh $(grep -oP "'prism_version'\s*=>\s*'\K[0-9.]+" includes/class-bac-options.php)

      - name: Refresh MathJax
        run: |
          VER=$(grep -oP "'mathjax_version'\s*=>\s*'\K[0-9.]+" includes/class-bac-options.php)
          curl -sL "https://cdn.jsdelivr.net/npm/mathjax@${VER}/es5/tex-chtml.js" -o assets/mathjax/es5/tex-chtml.js
          echo "MathJax $VER: $(du -sh assets/mathjax/es5/tex-chtml.js)"

      - name: Refresh KaTeX
        run: bash download-katex.sh $(grep -oP "'katex_version'\s*=>\s*'\K[0-9.]+" includes/class-bac-options.php)

      - name: Auto-bump
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Pull latest to avoid race with parallel runs
          git pull --rebase origin main
          CUR=$(grep -oP "Version:\s*\K[0-9.]+" babel-arcaea-code.php | head -1)
          IFS=. read -r MAJ MIN PAT <<< "$CUR"
          NEW="$MAJ.$MIN.$((PAT+1))"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"
          sed -i "s/^ \* Version: $CUR/ * Version: $NEW/" babel-arcaea-code.php
          sed -i "s/^define('BAC_VERSION', '$CUR');/define('BAC_VERSION', '$NEW');/" babel-arcaea-code.php
          if test -f package.json; then
            sed -i "s/\"version\": \"$CUR\"/\"version\": \"$NEW\"/" package.json || true
          fi
          if test -f package-lock.json; then
            sed -i "0,/\"version\": \"$CUR\"/s//\"version\": \"$NEW\"/" package-lock.json || true
            sed -i "0,/\"version\": \"$CUR\"/s//\"version\": \"$NEW\"/" package-lock.json || true
          fi
          cat > update-info.json <<EOF
          {
            "name": "Babel Arcaea Code",
            "slug": "babel-arcaea-code",
            "version": "$NEW",
            "homepage": "https://github.com/${{ github.repository }}",
            "author": "Babel36acl",
            "author_homepage": "https://github.com/Babel36acl",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/v$NEW/babel-arcaea-code-$NEW.zip",
            "requires_php": "7.4",
            "sections": {
              "description": "Unified Prism.js + Mermaid + MathJax + Markmap renderer. Local assets, no CDN by default. CI auto-syncs all assets. Replaces Sakurairo's built-in Prism.",
              "changelog": "<p>See the <a href=\"https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md\">CHANGELOG.md</a> and the <a href=\"https://github.com/${{ github.repository }}/releases/tag/v$NEW\">v$NEW release page</a> for release notes.</p>"
            }
          }
          EOF
          git add babel-arcaea-code.php package.json package-lock.json update-info.json includes assets blocks bin scripts
          git commit -m "chore: bump $CUR → $NEW [skip ci]"
          git push

      - name: Build zip
        id: build
        run: |
          VER="${{ steps.bump.outputs.new_version }}"
          ZIPPATH="$(bash scripts/build-release.sh "$VER")"
          ZIPNAME="$(basename "$ZIPPATH")"
          echo "zipname=$ZIPNAME" >> "$GITHUB_OUTPUT"
          echo "zippath=$ZIPPATH" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.new_version }}
          ZIPNAME: ${{ steps.build.outputs.zipname }}
          ZIPPATH: ${{ steps.build.outputs.zippath }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            "$ZIPPATH"

  # ── Daily sync ALL deps ──
  sync-deps:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 1. Mermaid ──
      - name: Download Mermaid
        id: mermaid
        run: |
          CUR=$(grep -oP "'mermaid_version'\s*=>\s*'\K[0-9.]+" includes/class-bac-options.php)
          LAT=$(curl -fsSL "https://registry.npmjs.org/mermaid/latest" | grep -oP '"version":"\K[0-9.]+')
          test -n "$LAT"
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "latest=$LAT" >> "$GITHUB_OUTPUT"
          echo "changed=$([ "$CUR" = "$LAT" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          bash download-mermaid.sh "$LAT"
          if [ "$CUR" != "$LAT" ]; then
            sed -i "s/\('mermaid_version'\s*=>\s*'\)[0-9.]\+/\1$LAT/" includes/class-bac-options.php
            sed -i "s/\('mermaid_version'=>'\)[0-9.]\+/\1$LAT/" includes/class-bac-options.php
          fi

      # ── 2. Prism.js ──
      - name: Download Prism
        id: prism
        run: |
          CUR=$(grep -oP "'prism_version'\s*=>\s*'\K[0-9.]+" includes/class-bac-options.php)
          LAT=$(curl -sL "https://registry.npmjs.org/prismjs/latest" | grep -oP '"version":"\K[0-9.]+')
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "latest=$LAT" >> "$GITHUB_OUTPUT"
          echo "changed=$([ "$CUR" = "$LAT" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          bash download-prism.sh "$LAT"
          if [ "$CUR" != "$LAT" ]; then
            sed -i "s/\('prism_version'\s*=>\s*'\)[0-9.]\+/\1$LAT/" includes/class-bac-options.php
            sed -i "s/\('prism_version'=>'\)[0-9.]\+/\1$LAT/" includes/class-bac-options.php
          fi

      # ── 3. MathJax ──
      - name: Download MathJax
        id: mathjax
        run: |
          CUR=$(grep -oP "'mathjax_version'\s*=>\s*'\K[0-9.]+" includes/class-bac-options.php)
          LAT=$(curl -sL "https://registry.npmjs.org/mathjax/latest" | grep -oP '"version":"\K[0-9.]+')
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "latest=$LAT" >> "$GITHUB_OUTPUT"
          echo "changed=$([ "$CUR" = "$LAT" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          curl -sL "https://cdn.jsdelivr.net/npm/mathjax@${LAT}/es5/tex-chtml.js" -o assets/mathjax/es5/tex-chtml.js
          echo "MathJax $LAT: $(du -sh assets/mathjax/es5/tex-chtml.js)"
          if [ "$CUR" != "$LAT" ]; then
            sed -i "s/\('mathjax_version'\s*=>\s*'\)[0-9.]\+/\1$LAT/" includes/class-bac-options.php
            sed -i "s/\('mathjax_version'=>'\)[0-9.]\+/\1$LAT/" includes/class-bac-options.php
          fi

      # ── 4. KaTeX ──
      - name: Download KaTeX
        id: katex
        run: |
          CUR=$(grep -oP "'katex_version'\s*=>\s*'\K[0-9.]+" includes/class-bac-options.php)
          LAT=$(curl -sL "https://registry.npmjs.org/katex/latest" | grep -oP '"version":"\K[0-9.]+')
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "latest=$LAT" >> "$GITHUB_OUTPUT"
          echo "changed=$([ "$CUR" = "$LAT" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          bash download-katex.sh "$LAT"
          if [ "$CUR" != "$LAT" ]; then
            sed -i "s/\('katex_version'\s*=>\s*'\)[0-9.]\+/\1$LAT/" includes/class-bac-options.php
            sed -i "s/\('katex_version'=>'\)[0-9.]\+/\1$LAT/" includes/class-bac-options.php
          fi

      # ── PR if any dep changed ──
      - name: Create PR
        if: steps.mermaid.outputs.changed == 'true' || steps.prism.outputs.changed == 'true' || steps.mathjax.outputs.changed == 'true' || steps.katex.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          commit-message: "chore: update deps"
          title: "chore: update deps${{ steps.mermaid.outputs.changed == 'true' && format(' Mermaid {0}', steps.mermaid.outputs.latest) || '' }}${{ steps.prism.outputs.changed == 'true' && format(' Prism {0}', steps.prism.outputs.latest) || '' }}${{ steps.mathjax.outputs.changed == 'true' && format(' MathJax {0}', steps.mathjax.outputs.latest) || '' }}${{ steps.katex.outputs.changed == 'true' && format(' KaTeX {0}', steps.katex.outputs.latest) || '' }}"
          body: |
            Automated daily dependency update.

            | Dep | Current | Latest |
            |---|---|---:|
            | Mermaid | `${{ steps.mermaid.outputs.current }}` | `${{ steps.mermaid.outputs.latest }}` |
            | Prism.js | `${{ steps.prism.outputs.current }}` | `${{ steps.prism.outputs.latest }}` |
            | MathJax | `${{ steps.mathjax.outputs.current }}` | `${{ steps.mathjax.outputs.latest }}` |
            | KaTeX | `${{ steps.katex.outputs.current }}` | `${{ steps.katex.outputs.latest }}` |
          branch: chore/deps-bump
          base: main
          labels: automated, dependencies
