name: Validate

on:
  pull_request:
    paths:
      - '**.php'
      - 'assets/**'
      - 'bin/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate.yml'
  push:
    branches:
      - main
    paths:
      - '**.php'
      - 'assets/**'
      - 'bin/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP lint
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

  asset-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required assets
        run: |
          set -e
          echo "=== Prism ==="
          test -f assets/prism/prism.js
          echo "  ✓ prism.js"
          test -f assets/prism/prism.css
          echo "  ✓ prism.css"

          echo "=== Mermaid ==="
          test -f assets/mermaid/mermaid.esm.min.mjs
          echo "  ✓ mermaid.esm.min.mjs"
          count=$(find assets/mermaid/chunks/mermaid.esm.min/ -name '*.mjs' | wc -l)
          test "$count" -gt 0 || exit 1
          echo "  ✓ $count mermaid chunks"

          echo "=== MathJax ==="
          test -f assets/mathjax/es5/tex-chtml.js
          echo "  ✓ mathjax"
          test -f assets/mathjax/mathjax-init.js
          echo "  ✓ mathjax-init.js"

          echo "=== KaTeX ==="
          test -f assets/katex/katex.min.js
          echo "  ✓ katex.min.js"
          test -f assets/katex/katex.min.css
          echo "  ✓ katex.min.css"
          test -f assets/katex/auto-render.min.js
          echo "  ✓ auto-render.min.js"
          test -f assets/katex/katex-init.js
          echo "  ✓ katex-init.js"

          echo "=== Shared CSS ==="
          test -f assets/css/bac-latex.css
          echo "  ✓ bac-latex.css"

          echo "=== Medium Zoom ==="
          test -f assets/js/medium-zoom.min.js
          echo "  ✓ medium-zoom.min.js"

          echo "=== Markmap vendor ==="
          test -f assets/markmap/vendor/d3.min.js
          echo "  ✓ d3.min.js"
          test -f assets/markmap/vendor/markmap-view.min.js
          echo "  ✓ markmap-view.min.js"
          test -f assets/markmap/vendor/markmap-lib.min.js
          echo "  ✓ markmap-lib.min.js"
          test -f assets/markmap/vendor/versions.json
          echo "  ✓ versions.json"

          echo ""
          echo "✅ All required assets present."

  js-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JS syntax
        run: |
          node --check assets/mermaid/mermaid-init.js
          node --check assets/markmap/markmap-init.js
          node --check assets/katex/katex-init.js
          node --check assets/mathjax/mathjax-init.js

  cli-render-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          test -f package.json && npm install --ignore-scripts 2>/dev/null || true
      - name: Verify CLI renderer
        run: |
          set -e
          test -f bin/markmap-render.js
          echo "  ✓ bin/markmap-render.js exists"
          echo '# Test' | node bin/markmap-render.js > /tmp/test.svg
          grep -q '<svg' /tmp/test.svg
          echo "  ✓ CLI renderer produces valid SVG"

  frontend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run frontend asset smoke tests
        run: bash scripts/frontend-smoke.sh

  privacy-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run privacy audit
        run: |
          if [ -f scripts/privacy-audit.sh ]; then
            bash scripts/privacy-audit.sh
          else
            echo "scripts/privacy-audit.sh not found — skipping."
          fi

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release package
        run: |
          bash scripts/build-release.sh
          test -f dist/babel-arcaea-code-*.zip
