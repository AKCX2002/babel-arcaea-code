name: Sync Markmap Assets

on:
  workflow_dispatch:
  schedule:
    - cron: '26 3 * * 1'

permissions:
  contents: write

jobs:
  sync-markmap-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Markmap runtime packages
        run: |
          npm init -y
          npm install --save-exact d3@7 markmap-lib markmap-view

      - name: Resolve and copy browser runtime assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/markmap/vendor

          cp node_modules/d3/dist/d3.min.js assets/markmap/vendor/d3.min.js

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function pkgRoot(pkg) {
            return path.dirname(require.resolve(`${pkg}/package.json`));
          }

          function firstExisting(candidates) {
            for (const file of candidates) {
              if (fs.existsSync(file) && fs.statSync(file).isFile()) return file;
            }
            throw new Error(`None of these files exist:\n${candidates.join('\n')}`);
          }

          function copyRuntime(pkg, outName, candidates) {
            const root = pkgRoot(pkg);
            const file = firstExisting(candidates.map((item) => path.join(root, item)));
            const out = path.join('assets/markmap/vendor', outName);
            fs.copyFileSync(file, out);
            console.log(`${pkg}: ${file} -> ${out}`);
          }

          copyRuntime('markmap-view', 'markmap-view.min.js', [
            'dist/browser/index.js',
            'dist/index.js',
            'lib/index.js',
          ]);

          copyRuntime('markmap-lib', 'markmap-lib.min.js', [
            'dist/browser/index.js',
            'dist/index.js',
            'lib/index.js',
          ]);

          const versions = {
            d3: require('./node_modules/d3/package.json').version,
            'markmap-lib': require('./node_modules/markmap-lib/package.json').version,
            'markmap-view': require('./node_modules/markmap-view/package.json').version,
          };
          fs.writeFileSync('assets/markmap/vendor/versions.json', JSON.stringify(versions, null, 2) + '\n');
          NODE

      - name: Verify vendor files
        run: |
          test -s assets/markmap/vendor/d3.min.js
          test -s assets/markmap/vendor/markmap-view.min.js
          test -s assets/markmap/vendor/markmap-lib.min.js
          test -s assets/markmap/vendor/versions.json

      - name: Commit updated Markmap assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync Markmap vendor assets [skip ci]"
          file_pattern: |
            package.json
            package-lock.json
            assets/markmap/vendor/d3.min.js
            assets/markmap/vendor/markmap-view.min.js
            assets/markmap/vendor/markmap-lib.min.js
            assets/markmap/vendor/versions.json
